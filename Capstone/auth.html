<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustLend Authentication</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        *{
            font-family:'Poppins',sans-serif;
        }

        body{
            background:#f4f6fb;
        }

        input{
            outline:none;
        }

        .active{
            background:#132F6B;
            color:white;
        }

        .inactive{
            background:white;
            color:#132F6B;
        }

        .fade{
            transition:.3s;
        }
    </style>

</head>

<body>

<div class="min-h-screen flex items-center justify-center p-6">

<div class="w-full max-w-6xl bg-white rounded-xl shadow-2xl overflow-hidden">

<div class="grid md:grid-cols-2">

<!-- ================= LEFT SIDE ================= -->

<div class="relative">

<img
id="sideImage"
src="images/close-up-camera-tripod-sandy-beach-camera-with-lens 1.png"
class="w-full h-full object-cover"
alt="">

<div class="absolute top-8 left-8 flex items-center gap-2">

<img
src="images/logo.png"
class="w-10">

<h1 class="text-white font-bold text-2xl">
Trust<span class="text-yellow-400">Lend</span>
</h1>

</div>

</div>

<!-- ================= RIGHT SIDE ================= -->

<div class="bg-[#F6F8FD] p-10 flex items-center">

<div class="w-full max-w-md mx-auto">

<h2
id="pageTitle"
class="text-4xl font-bold text-center text-[#132F6B]">

Sign up as an

</h2>

<h3
id="roleTitle"
class="text-4xl font-bold text-center text-yellow-500 mt-2">

Owner

</h3>

<!-- Toggle -->

<div class="flex justify-center mt-8">

<div class="bg-white rounded-full p-1 flex shadow">

<button
id="renterBtn"
onclick="switchRole('renter')"
class="px-6 py-2 rounded-full inactive">

I'm a Renter

</button>

<button
id="ownerBtn"
onclick="switchRole('owner')"
class="px-6 py-2 rounded-full active">

I'm an Owner

</button>

</div>

</div>

<p
id="description"
class="text-center text-gray-500 text-sm mt-5">

Find trusted equipment nearby and book with confidence.

</p>

<!-- FORM -->

<form class="mt-8 space-y-4">

<input
type="text"
placeholder="Full Name"
class="w-full border rounded-full px-5 py-3">

<input
type="email"
placeholder="Email Address"
class="w-full border rounded-full px-5 py-3">

<input
type="text"
placeholder="Phone Number"
class="w-full border rounded-full px-5 py-3">

<div class="relative">

<input
id="password"
type="password"
placeholder="Password"
class="w-full border rounded-full px-5 py-3">

<button
type="button"
onclick="togglePassword()"
class="absolute right-5 top-3">

👁

</button>

</div>

<div class="relative">

<input
id="confirmPassword"
type="password"
placeholder="Confirm Password"
class="w-full border rounded-full px-5 py-3">

<button
type="button"
onclick="toggleConfirmPassword()"
class="absolute right-5 top-3">

👁

</button>

</div>

<div class="flex items-start gap-3">

<input
type="checkbox"
class="mt-1">

<p class="text-sm">

I agree to the

<a href="#" class="text-[#132F6B] font-semibold">
Terms &
Conditions
</a>

and

<a href="#" class="text-[#132F6B] font-semibold">
Privacy Policy
</a>

</p>

</div>

<button
class="w-full bg-[#132F6B] hover:bg-[#0D234F] text-white py-3 rounded-full font-semibold transition">

Create Account

</button>

</form>

<p class="text-center text-sm mt-8">

Already have an account?

<a
href="signup.html"
onclick="switchMode()"
class="text-yellow-500 font-semibold">

Log in

</a>

</p>

<script>

let currentRole = "owner";
let currentMode = "signup";

// ----------------------------
// Switch Between Owner/Renter
// ----------------------------
function switchRole(role){

    currentRole = role;

    const ownerBtn = document.getElementById("ownerBtn");
    const renterBtn = document.getElementById("renterBtn");

    const roleTitle = document.getElementById("roleTitle");
    const description = document.getElementById("description");
    const sideImage = document.getElementById("sideImage");

    if(role === "owner"){

        ownerBtn.classList.add("active");
        ownerBtn.classList.remove("inactive");

        renterBtn.classList.remove("active");
        renterBtn.classList.add("inactive");

        roleTitle.innerHTML = "Owner";

        description.innerHTML =
        "Find trusted equipment nearby and book with confidence.";

        sideImage.src = "images/owner.jpg";

    }else{

        renterBtn.classList.add("active");
        renterBtn.classList.remove("inactive");

        ownerBtn.classList.remove("active");
        ownerBtn.classList.add("inactive");

        roleTitle.innerHTML = "Renter";

        description.innerHTML =
        "Browse equipment available near you and rent securely.";

        sideImage.src = "images/renter.jpg";

    }

}

// ----------------------------
// Signup/Login Switch
// ----------------------------

function switchMode(){

    const pageTitle = document.getElementById("pageTitle");
    const form = document.querySelector("form");
    const submitBtn = form.querySelector("button");
    const bottomText = document.querySelector("p:last-child");

    const fullName = form.querySelector('input[type="text"]');
    const phone = form.querySelectorAll('input[type="text"]')[1];
    const confirm = document.getElementById("confirmPassword");

    if(currentMode === "signup"){

        currentMode = "login";

        pageTitle.innerHTML = "Login as a";

        fullName.parentElement.style.display = "none";
        phone.parentElement.style.display = "none";
        confirm.parentElement.style.display = "none";

        submitBtn.innerHTML = "Login";

        bottomText.innerHTML =
        `Don't have an account?
        <a href="#" onclick="switchMode()" class="text-yellow-500 font-semibold">
        Sign Up
        </a>`;

    }else{

        currentMode = "signup";

        pageTitle.innerHTML = "Sign up as an";

        fullName.parentElement.style.display = "block";
        phone.parentElement.style.display = "block";
        confirm.parentElement.style.display = "block";

        submitBtn.innerHTML = "Create Account";

        bottomText.innerHTML =
        `Already have an account?
        <a href="#" onclick="switchMode()" class="text-yellow-500 font-semibold">
        Log in
        </a>`;

    }

}

// ----------------------------
// Password Toggle
// ----------------------------

function togglePassword(){

    const input = document.getElementById("password");

    input.type =
        input.type === "password"
        ? "text"
        : "password";

}

function toggleConfirmPassword(){

    const input = document.getElementById("confirmPassword");

    input.type =
        input.type === "password"
        ? "text"
        : "password";

}

</script>

</body>
</html>

</div>

</div>

</div>

</div>
