<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrustLend - Search-filter</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Poppins', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
          colors: {
            brand: '#132F6B',
            brandLight: '#1A3D7D',
            accent: '#F59E0B',
            surface: '#F6F8FD',
            activeGreen: '#2E7D5B',
            activeGreenBg: '#E8F5EC',
            upcomingTeal: '#1A7F7F',
            upcomingTealBg: '#E0F2F1',
            maintYellow: '#C49A1A',
            maintYellowBg: '#FFF8E1',
            returnedGray: '#6B7280',
            returnedGrayBg: '#F3F4F6',
          },
        },
      },
    }
  </script>

  
</head>
<body>
    <!-- Search-->
<div id="searchPopup" class="fixed inset-0 bg-black/40 flex items-center justify-center z-40 bg-[#F2F7FF]">
  <div class="rounded-2xl w-[500px] p-6 bg-[#F2F7FF] flex-col">

    <div class="flex flex-row gap-3 items-center">
      <select id="locationSelect"  class="rounded-2xl border px-4 py-3 text-slate-400 bg-slate-50" onchange="this.classList.remove('text-slate-400'); this.classList.add('text-black')">
        <option disabled selected>Location</option>
        <option value="abia">Abia</option>
        <option value="adamawa">Adamawa</option>
        <option value="akwa-ibom">Akwa Ibom</option>
        <option value="anambra">Anambra</option>
        <option value="bauchi">Bauchi</option>
        <option value="bayelsa">Bayelsa</option>
        <option value="benue">Benue</option>
        <option value="borno">Borno</option>
        <option value="cross-river">Cross River</option>
        <option value="delta">Delta</option>
        <option value="ebonyi">Ebonyi</option>
        <option value="edo">Edo</option>
        <option value="ekiti">Ekiti</option>
        <option value="enugu">Enugu</option>
        <option value="fct">FCT (Abuja)</option>
        <option value="gombe">Gombe</option>
        <option value="imo">Imo</option>
        <option value="jigawa">Jigawa</option>
        <option value="kaduna">Kaduna</option>
        <option value="kano">Kano</option>
        <option value="katsina">Katsina</option>
        <option value="kebbi">Kebbi</option>
        <option value="kogi">Kogi</option>
        <option value="kwara">Kwara</option>
        <option value="lagos">Lagos</option>
        <option value="nasarawa">Nasarawa</option>
        <option value="niger">Niger</option>
        <option value="ogun">Ogun</option>
        <option value="ondo">Ondo</option>
        <option value="osun">Osun</option>
        <option value="oyo">Oyo</option>
        <option value="plateau">Plateau</option>
        <option value="rivers">Rivers</option>
        <option value="sokoto">Sokoto</option>
        <option value="taraba">Taraba</option>
        <option value="yobe">Yobe</option>
        <option value="zamfara">Zamfara</option>
    </select>

      <div class="relative flex-1">
        <input type="text" placeholder="Search equipment" 
               class="w-full rounded-2xl border px-4 py-3 bg-slate-50">
        <i class="fa-solid fa-magnifying-glass absolute right-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
      </div>

      
    </div>

    <div class="flex flex-row justify-end">
        <button onclick="document.getElementById('filtersPopup').classList.remove('hidden') " class="text-brand px-2 py-2">
            <i class="fa-solid fa-sliders"></i>
      </button>
      </div>

    <div class="flex flex-row justify-between items-center mt-6">
      <h3 class="font-semibold text-sm text-brand">RECENT SEARCHES</h3>
      <a href="#" class="text-red-500 text-sm">Clear all</a>
    </div>
    <div class="flex flex-row gap-2 mt-2">
      <span class="bg-slate-100 text-accent px-3 py-1 rounded-2xl text-sm">Camera</span>
    </div>

    <h3 class="font-semibold text-sm mt-6 text-brand">TRENDING SEARCHES</h3>
    <div class="flex flex-row gap-2 mt-2">
      <span class="bg-slate-100 text-accent px-3 py-1 rounded-2xl text-sm">Headset</span>
      <span class="bg-slate-100 text-accent px-3 py-1 rounded-2xl text-sm">Fog machine</span>
      <span class="bg-slate-100 text-accent px-3 py-1 rounded-2xl text-sm">Electric drill</span>
    </div>

  </div>
</div>


<!-- filter -->
<div id="filtersPopup" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center z-50">
  <div class="bg-[#F2F7FF] rounded-2xl w-[400px] p-6 max-h-[90vh] overflow-y-auto">

    <div class="flex flex-row justify-between items-center mb-4">
      <h3 class="font-bold text-lg text-brand">Filters</h3>
      <button onclick="document.getElementById('filtersPopup').classList.add('hidden')">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <p class="font-semibold text-brand">Category</p>
    <div class="grid grid-cols-3 gap-2 mt-2">
      <button class="bg-brand text-white px-3 py-2 rounded-lg text-sm">Cameras</button>
      <button class="border text-brand px-3 py-2 rounded-lg text-sm">Lenses</button>
      <button class="border text-brand px-3 py-2 rounded-lg text-sm">Lighting</button>
      <button class="border text-brand px-3 py-2 rounded-lg text-sm">Audio</button>
      <button class="border text-brand px-3 py-2 rounded-lg text-sm">Decoration</button>
      <button class="border text-brand px-3 py-2 rounded-lg text-sm">More</button>
    </div>

    <p class="font-semibold mt-6 text-[#0B2554]">Location</p>
    <input type="text" placeholder="e.g Lagos" class="w-full rounded-2xl border px-4 py-3 mt-2 bg-slate-50 text-[#0B2554]">

    <p class="font-semibold mt-6 text-[#0B2554]">Price range</p>
    <input type="range" min="5000" max="100000" class="w-full mt-2">
    <div class="flex flex-row justify-between text-sm text-slate-500">
      <span >₦5,000</span>
      <span>₦100,000+</span>
    </div>

    <p class="font-semibold mt-6 text-[#0B2554]">Availability</p>
    <label class="flex items-center gap-2 mt-2">
      <input type="checkbox">
      <span class="text-[#0B2554]">Readily available</span>
    </label>
    <label class="flex items-center gap-2 mt-2">
      <input type="checkbox" checked>
      <span class="text-[#0B2554]">Available on schedule</span>
    </label>

    <p class="font-semibold mt-6 text-[#0B2554]">Vendor rating</p>
    <div class="grid grid-cols-3 gap-2 mt-2">
      <button class="border px-3 py-2 rounded-2xl text-sm text-[#0B2554]">5 <i class="fa-solid fa-star text-accent"></i></button>
      <button class="border px-3 py-2 rounded-2xl text-sm text-[#0B2554]">4+ <i class="fa-solid fa-star text-accent"></i></button>
      <button class="border px-3 py-2 rounded-2xl text-sm text-[#0B2554]">3+ <i class="fa-solid fa-star text-accent"></i></button>
    </div>

    <button class="bg-[#0B2554] text-white w-full py-3 rounded-2xl mt-6">Apply</button>

  </div>
</div>
</body>
</html>
